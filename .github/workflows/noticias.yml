name: Atualizar notícias da vitrine

on:
  schedule:
    - cron: "7 * * * *"   # a cada hora
  workflow_dispatch:
  push:
    paths:
      - "scripts/noticias.py"
      - ".github/workflows/noticias.yml"

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar manchetes
        run: python scripts/noticias.py
      - name: Salvar se mudou
        run: |
          git config user.name "vitrine-bot"
          git config user.email "vitrine-bot@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || (git commit -m "Notícias da vitrine $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
