<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Loja</title>
<meta name="description" content="Catálogo de produtos">
<meta name="theme-color" content="#0b0b10">
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p:#0a84ff; --p-ink:#fff; --a:#ff9f0a;
  --bg:#08080a; --bg2:#111114; --card:#151518; --line:#26262b;
  --tx:#f4f4f7; --mut:#9a9aab; --ok:#30d158; --bad:#ff453a;
  --r:18px; --sh:0 10px 40px rgba(0,0,0,.35);
}
body.claro{
  --bg:#f3ebe4; --bg2:#efe4d9; --card:#faf5f0; --line:#dccdbf;
  --tx:#161412; --mut:#776b5f; --sh:0 12px 30px rgba(90,70,50,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
.hide{display:none!important}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;transition:.2s;white-space:nowrap}
.btn-p{background:var(--p);color:var(--p-ink)}
.btn-p:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-g{background:color-mix(in srgb,var(--tx) 8%,transparent);border:1px solid var(--line)}
.btn-g:hover{background:color-mix(in srgb,var(--tx) 14%,transparent)}
.btn-wa{background:#25d366;color:#fff}
.btn-wa:hover{filter:brightness(1.07)}
.btn-bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.5;pointer-events:none}

/* header */
header.top{position:sticky;top:0;z-index:40;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);background:color-mix(in srgb,var(--bg) 75%,transparent);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand img{height:44px;width:auto;max-width:170px;object-fit:contain}
body.claro .brand img.logo-mono,body.claro .logo-prev img.logo-mono{filter:invert(1)}
.wm{display:inline-grid;justify-items:center;line-height:1}
.wm b{font-size:21px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.wm small{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:600;letter-spacing:.42em;margin-top:3px;text-transform:uppercase;color:var(--mut)}
.wm small::before,.wm small::after{content:"";width:14px;height:1px;background:currentColor}
.pill{letter-spacing:.14em;text-transform:uppercase;font-size:11.5px!important}
body.claro .pill{background:linear-gradient(180deg,#b6a796,#a39482);border:1px solid #9a8b79;color:#1d1813;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
body.claro .pill i{background:#1d1813;box-shadow:none}
body.claro .hero::before{background:radial-gradient(520px 520px at 50% 40%,#ece0d3 0,#e6d8ca 55%,transparent 72%);opacity:1;filter:none}
body.claro .hero::after{content:"";position:absolute;left:50%;top:50%;width:540px;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #d9c9b9;box-shadow:inset 0 0 0 10px #e9ddd0,inset 0 0 0 12px #d6c5b4;pointer-events:none;opacity:.55;z-index:0}
.hero .wrap{z-index:1}
body.claro .hero::after{display:none}
body.claro .card{box-shadow:0 2px 10px rgba(90,70,50,.06)}
body.claro .card .ph{background:linear-gradient(160deg,#efe5da,#f8f2ec)}
body.claro header.top{background:color-mix(in srgb,#f3ebe4 82%,transparent)}
.brand .mono{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--a));display:grid;place-items:center;color:#fff;font-size:17px}
.nav{display:flex;gap:6px;align-items:center}
.nav a.lk{padding:8px 12px;border-radius:999px;color:var(--mut);font-weight:500;font-size:14px}
.nav a.lk:hover{color:var(--tx)}
@media(max-width:720px){.nav a.lk{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;padding:30px 0 26px;background:linear-gradient(180deg,color-mix(in srgb,var(--a) 22%,var(--bg)) 0%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.hero::before{display:none!important}
.hero::before{content:"";position:absolute;inset:-40% -10% auto;height:120%;background:radial-gradient(600px 300px at 20% 30%,color-mix(in srgb,var(--p) 14%,transparent),transparent 70%),radial-gradient(500px 280px at 85% 20%,color-mix(in srgb,var(--a) 22%,transparent),transparent 70%);filter:blur(10px);opacity:.9;pointer-events:none}
.hero .wrap{position:relative;display:grid;gap:10px;max-width:760px;text-align:center;justify-items:center}
.pill{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 70%,transparent);font-size:13px;color:var(--mut);font-weight:500}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.hero h1{font-size:clamp(24px,3.4vw,36px);line-height:1.15;letter-spacing:-.035em;font-weight:800}
.hero h1 span{background:linear-gradient(180deg,var(--tx) 10%,var(--a) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:clamp(14px,1.5vw,16px);max-width:560px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* seções */
section.sec{padding:28px 0}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(24px,3.4vw,34px);letter-spacing:-.03em;font-weight:800}
.sec-h p{color:var(--mut)}

/* destaques */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(230px,calc(25% - 12px),290px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}

/* filtros */
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:46px}
.search input{flex:1;background:none;border:0;outline:0;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;white-space:nowrap;color:var(--mut)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.25s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--p) 40%,var(--line))}
.card .ph{aspect-ratio:1;background:linear-gradient(160deg,color-mix(in srgb,var(--tx) 4%,var(--card)),var(--card));display:grid;place-items:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:.4s}
.card:hover .ph img{transform:scale(1.04)}
.card .bd{padding:14px 16px 16px;display:grid;gap:6px;flex:1}
.card .cat{font-size:12px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto}
.price b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.price s{color:var(--mut);font-size:13px}
.card .inst{font-size:12px;color:var(--mut)}
.tags{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line)}
.tag.off{background:var(--a);color:#111;border:0}
.tag.no{background:var(--bad);color:#fff;border:0}
.tag.laser{background:linear-gradient(90deg,#d9c3a5,#a88b67);color:#1a140d;border:0}
.card.sold .ph{filter:grayscale(1);opacity:.6}
@media(max-width:560px){.card .bd{padding:10px 12px 12px}.card h3{font-size:14px}.price b{font-size:16px}}

.carr{position:relative;isolation:isolate}
.carr::before,.carr::after{content:"";position:absolute;top:0;bottom:0;width:28px;z-index:2;pointer-events:none}
.carr::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.carr::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.cats{overflow:hidden;position:relative;padding:6px 0 10px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.ctrack{display:flex;width:max-content;transform:translate3d(0,0,0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cats.drag{cursor:grabbing}
.cats img,.cats a{-webkit-user-drag:none}
.cset{display:flex;gap:14px;padding-right:14px;flex:0 0 auto}
.cset .cat-t{flex:0 0 156px;width:156px;overflow:hidden}
@media(max-width:560px){.cset{gap:10px;padding-right:10px}.cset .cat-t{flex-basis:118px;width:118px}}
.carr-b{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);font-size:26px;line-height:1;display:grid;place-items:center;color:var(--tx);transition:.2s}
@media(hover:hover){.carr-b:hover{background:var(--tx);color:var(--bg)}}
.carr-b{-webkit-tap-highlight-color:transparent}
.carr-b:active{transform:translateY(-50%) scale(.92)}
.carr-b.prev{left:-6px}.carr-b.next{right:-6px}
@media(max-width:560px){.carr-b{width:36px;height:36px;font-size:22px}.carr-b.prev{left:-4px}.carr-b.next{right:-4px}}
.cat-t{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px 14px;display:grid;justify-items:center;align-content:start;gap:4px;text-align:center;box-sizing:border-box;min-width:0}
@media(hover:hover){.cat-t:hover{box-shadow:var(--sh);border-color:color-mix(in srgb,var(--a) 60%,var(--line))}}
.cat-t{-webkit-tap-highlight-color:transparent}
.cat-t .ci{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 18%,var(--card));color:var(--tx);overflow:hidden;margin-bottom:6px;border:1px solid color-mix(in srgb,var(--a) 35%,transparent)}
.cat-t .ci svg{width:56%;height:56%;opacity:.85}
.cat-t .ci img{width:100%;height:100%;object-fit:cover}
.cat-t b{font-size:14px;font-weight:600;line-height:1.25}
.cat-t small{font-size:12px;color:var(--mut)}
@media(max-width:560px){.cat-t{padding:12px 6px}.cat-t .ci{width:60px;height:60px}.cat-t b{font-size:12.5px}}
section.sec{scroll-margin-top:60px}
.tools .catsel{flex:0 0 auto;width:auto;min-width:220px;height:46px;border-radius:999px;padding:0 16px;cursor:pointer}
@media(max-width:560px){.catsel{display:none}}
.sticky-chips{position:sticky;top:64px;z-index:20;background:var(--bg);padding:10px 0;margin:0 -2px}
.sw{display:inline-block;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),0 0 0 1px rgba(255,255,255,.35);flex:0 0 auto;vertical-align:middle}
.swrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:2px 0 4px}
.swrow small{font-size:11px;color:var(--mut)}
.apartir{display:block;width:100%;font-size:11px;color:var(--mut);margin-bottom:-6px}
.opts{display:grid;gap:8px}
.opt-h{font-size:14px;color:var(--mut)} .opt-h b{color:var(--tx)}
.cores-sel{display:flex;gap:10px;flex-wrap:wrap}
.csel{padding:3px;border-radius:50%;border:2px solid transparent;line-height:0}
.csel.on{border-color:var(--tx)}
.caps-sel{display:flex;gap:8px;flex-wrap:wrap}
.capsel{display:grid;gap:1px;padding:9px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;min-width:92px}
.capsel b{font-size:15px} .capsel small{font-size:12px;color:var(--mut)}
.capsel.on{border-color:var(--tx);box-shadow:0 0 0 1px var(--tx)}
.fsec{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;background:color-mix(in srgb,var(--card) 60%,transparent)}
.fsec-h{display:grid;gap:2px} .fsec-h b{font-size:15px} .fsec-h span{font-size:12.5px;color:var(--mut)}
.cores-adm{display:flex;gap:8px;flex-wrap:wrap}
.cores-tools{width:100%;display:flex;gap:14px}
.lnk{font-size:13px;font-weight:600;color:var(--mut);text-decoration:underline}
.cchip{display:inline-flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;opacity:.6;transition:.15s}
.cchip input{display:none}
.cchip.on{opacity:1;border-color:var(--tx);box-shadow:0 0 0 1px var(--tx)}
.cchip.on span::after{content:" ✓";font-weight:800}
.rm{width:22px;height:22px;border-radius:50%;font-size:15px;line-height:1;color:var(--mut);display:grid;place-items:center}
.rm:hover{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.caps-adm{display:grid;gap:8px}
.caprow{display:grid;grid-template-columns:130px 1fr 26px;gap:10px;align-items:center;padding:6px 8px 6px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);opacity:.65}
.caprow.on{opacity:1;border-color:var(--tx)}
.caprow label{display:flex;gap:8px;align-items:center;cursor:pointer}
.caprow input[type=checkbox]{width:18px;height:18px;accent-color:var(--p)}
.caprow .inp{padding:8px 10px}
.add-row{display:flex;gap:8px;flex-wrap:wrap}
.add-row .inp{flex:1 1 180px;padding:8px 12px}
.pick{width:42px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:2px;cursor:pointer}
.hint{font-size:13px;color:var(--mut)}
.chk.flash{animation:fl 1.2s}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--a)}100%{box-shadow:none}}
.tools .admsel{flex:0 0 auto;width:auto;height:46px;border-radius:999px;padding:0 14px}
.empty{padding:60px 20px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r)}

/* diferenciais */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.feat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--p) 16%,transparent);color:var(--p);margin-bottom:12px;font-size:20px}
.feat h4{font-size:16px;margin-bottom:4px}
.feat p{color:var(--mut);font-size:14px}

/* footer */
footer{border-top:1px solid var(--line);margin-top:40px;padding:40px 0 100px;color:var(--mut);font-size:14px}
footer .wrap{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
footer h5{color:var(--tx);font-size:14px;margin-bottom:8px}
footer a:hover{color:var(--tx)}
.foot-b{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;font-size:13px}
.lojista{gap:6px}
@media(max-width:720px){.lojista span{display:none}.lojista{width:38px;height:38px;padding:0}}
.adm-link{opacity:.55}
.adm-link:hover{opacity:1}

.fab{position:fixed;right:18px;bottom:18px;z-index:45;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 10px 30px rgba(37,211,102,.45);transition:.2s}
.fab:hover{transform:scale(1.07)}
.fab svg{width:30px;height:30px;fill:#fff}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.md{background:var(--bg2);border:1px solid var(--line);border-radius:24px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;position:relative;animation:up .25s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.mbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.mbar .voltar{font-weight:700;font-size:16px;padding:8px 14px 8px 10px;border-radius:999px;background:color-mix(in srgb,var(--tx) 8%,transparent)}
.mbar .x{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--tx) 8%,transparent);font-size:22px;display:grid;place-items:center}
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:0}
@media(max-width:800px){.pd{grid-template-columns:1fr}.ov{padding:0;align-items:flex-end}.md{border-radius:24px 24px 0 0;max-height:94vh}}
.gal{padding:20px;display:grid;gap:10px;align-content:start}
.gal .main{aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--card);display:grid;place-items:center}
.gal .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs button{width:64px;height:64px;flex:0 0 auto;border-radius:12px;overflow:hidden;border:2px solid transparent;opacity:.6}
.thumbs button.on{border-color:var(--p);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:28px 26px 26px 6px;display:grid;gap:14px;align-content:start}
@media(max-width:800px){.info{padding:4px 20px 28px}}
.info h2{font-size:clamp(24px,3vw,32px);letter-spacing:-.03em;line-height:1.15}
.info .price b{font-size:30px}
.specs{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.specs div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.specs div:last-child{border:0}
.specs span{color:var(--mut)}
.specs b{font-weight:600;text-align:right}
.desc{color:var(--mut);white-space:pre-line;font-size:15px}
.perso{background:color-mix(in srgb,var(--p) 8%,var(--card));border:1px solid color-mix(in srgb,var(--p) 30%,var(--line));border-radius:14px;padding:14px;display:grid;gap:8px}
.perso label{font-weight:600;font-size:14px}
.perso small{color:var(--mut)}

/* forms */
.fld{display:grid;gap:6px}
.fld label{font-size:13px;font-weight:600;color:var(--mut)}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;outline:0;transition:.15s}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
textarea.inp{min-height:96px;resize:vertical}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.chk input{width:18px;height:18px;accent-color:var(--p)}

/* admin */
.adm{padding:24px 0 60px}
.login{max-width:400px;margin:8vh auto;background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:30px;display:grid;gap:14px;box-shadow:var(--sh)}
.login h2{letter-spacing:-.03em}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--a) 14%,transparent);border:1px solid color-mix(in srgb,var(--a) 35%,transparent)}
.err{color:var(--bad);font-size:14px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:999px;width:max-content;max-width:100%;overflow:auto}
.tabs button{padding:9px 18px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--p);color:var(--p-ink)}
.adm-h{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat small{color:var(--mut);font-size:12px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.plist{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.prow .th{width:60px;height:60px;border-radius:12px;overflow:hidden;background:var(--bg)}
.prow .th img{width:100%;height:100%;object-fit:cover}
.prow h4{font-size:15px;font-weight:600}
.prow .meta{font-size:13px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prow .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:end}
.prow.inativo{opacity:.55}
@media(max-width:620px){.prow{grid-template-columns:52px 1fr}.prow .th{width:52px;height:52px}.prow .act{grid-column:1/-1;justify-content:start}}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--tx) 10%,transparent)}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.no{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.badge.st{background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--a)}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:16px}
.panel h3{font-size:17px}
.fotos{display:flex;gap:10px;flex-wrap:wrap}
.foto{width:96px;height:96px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line)}
.foto img{width:100%;height:100%;object-fit:cover}
.foto .fx{position:absolute;inset:auto 4px 4px 4px;display:flex;justify-content:space-between}
.foto .fx button{width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;font-size:13px}
.foto .capa{position:absolute;top:4px;left:4px;font-size:10px;background:var(--p);color:var(--p-ink);padding:2px 6px;border-radius:6px;font-weight:700}
.up{width:110px;height:110px;border-radius:16px;border:2px dashed var(--a);background:color-mix(in srgb,var(--a) 10%,var(--card));display:grid;place-content:center;justify-items:center;gap:4px;color:var(--tx);font-size:13px;text-align:center;cursor:pointer;padding:6px;position:relative}
.fi{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.fwrap{display:grid;gap:5px;width:110px}
.fwrap .foto{width:110px;height:110px}
.fcor{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:10px;padding:3px 6px;background:var(--card)}
.fcor select{border:0;background:none;font-size:12px;width:100%;outline:0;padding:2px 0}
.cardsw{padding:2px;border-radius:50%;border:1.5px solid transparent;line-height:0}
.cardsw.on{border-color:var(--tx)}
.cfoto{width:22px;height:22px;border-radius:50%;object-fit:cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.cam{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:color-mix(in srgb,var(--tx) 7%,transparent)}
.cam.tem{background:var(--a);}
.up:hover{border-color:var(--p);color:var(--p)}
.logo-prev{height:72px;min-width:72px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:8px}
.logo-prev img{max-height:56px;max-width:220px;object-fit:contain}
.colors{display:flex;gap:14px;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.colors input[type=color]{width:36px;height:36px;border:0;background:none;padding:0;border-radius:8px;cursor:pointer}
.sticky-save{position:sticky;bottom:12px;display:flex;justify-content:end;gap:10px;z-index:5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;z-index:99;box-shadow:var(--sh);animation:up .25s}
.load{display:grid;place-items:center;min-height:50vh;color:var(--mut)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

/* compressão de imagem (sem Firebase Storage — fica dentro do Firestore) */
function compress(file, max=1000, type="image/jpeg", q=.78, limitKB=220){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
      let w=img.width,h=img.height; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d");
      if(type==="image/jpeg"){ x.fillStyle="#fff"; x.fillRect(0,0,w,h); }
      x.drawImage(img,0,0,w,h);
      let out=c.toDataURL(type,q);
      while(type==="image/jpeg" && out.length/1.37/1024>limitKB && q>.4){ q-=.08; out=c.toDataURL(type,q); }
      res(out);
    }; img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

function initCarrossel(){
  const el=$("#cats"); if(!el) return; const tr=el.querySelector(".ctrack");
  cancelAnimationFrame(window._carrRAF);
  const set0=tr.querySelector(".cset"); const setW=()=>set0.getBoundingClientRect().width;
  const reduz=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const vel=innerWidth<560?.35:.45;
  let pos=0, pausa=false, timer=0, anim=null, drag=null, moveu=false;
  const norm=()=>{ const w=setW(); if(!w) return; while(pos>=w) pos-=w; while(pos<0) pos+=w; };
  const pinta=()=>{ tr.style.transform=`translate3d(${-Math.round(pos)}px,0,0)`; };
  const retomar=ms=>{ clearTimeout(timer); timer=setTimeout(()=>{ pausa=false; },ms); };
  const parar=()=>{ pausa=true; clearTimeout(timer); };
  const tick=t=>{
    if(anim){ const k=Math.min(1,(t-anim.t0)/450); const e=1-Math.pow(1-k,3); pos=anim.de+(anim.para-anim.de)*e; if(k>=1){ anim=null; norm(); } }
    else if(!pausa && !drag && !reduz) { pos+=vel; norm(); }
    pinta(); window._carrRAF=requestAnimationFrame(tick);
  };
  /* setas */
  const passo=dir=>{ parar(); const t=tr.querySelector(".cat-t"); const d=(t?t.getBoundingClientRect().width+(innerWidth<560?10:14):170)*dir;
    if(dir<0 && pos+d<0){ pos+=setW(); }
    anim={de:pos,para:pos+d,t0:performance.now()}; retomar(3500); };
  el.parentElement.querySelector(".prev").onclick=()=>passo(-1);
  el.parentElement.querySelector(".next").onclick=()=>passo(1);
  /* mouse em cima pausa */
  el.addEventListener("mouseenter",parar); el.addEventListener("mouseleave",()=>{ if(!drag) retomar(600); });
  /* arrastar com dedo ou mouse */
  el.addEventListener("pointerdown",e=>{ parar(); anim=null; drag={x:e.clientX,y:e.clientY,p:pos,id:e.pointerId,ativo:false}; moveu=false; });
  el.addEventListener("pointermove",e=>{ if(!drag||e.pointerId!==drag.id) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!drag.ativo){ if(Math.abs(dx)>6 && Math.abs(dx)>Math.abs(dy)){ drag.ativo=true; moveu=true; el.classList.add("drag"); try{el.setPointerCapture(e.pointerId);}catch{} } else if(Math.abs(dy)>8){ drag=null; retomar(2000); return; } else return; }
    pos=drag.p-dx; norm(); if(pos!==drag.p-dx){ drag.p=pos+dx; } });
  const solta=()=>{ if(!drag) return; drag=null; el.classList.remove("drag"); retomar(2500); };
  el.addEventListener("pointerup",solta); el.addEventListener("pointercancel",solta);
  el.addEventListener("click",e=>{ if(moveu){ e.preventDefault(); e.stopPropagation(); moveu=false; } },true);
  window._carrRAF=requestAnimationFrame(tick);
}
function catIcon(c){
  const n=(c||"").toLowerCase(); let d;

function sincronizaCard(id,nome){
  if(!nome) return; document.querySelectorAll(`.card[data-id="${id}"]`).forEach(card=>{ const sw=[...card.querySelectorAll(".cardsw")].find(x=>x.dataset.cor===nome); if(sw) trocaCorCard(sw); });
}
function trocaCorCard(sw){
  const card=sw.closest(".card"); const p=S.produtos.find(x=>x.id===card.dataset.id); if(!p) return;
  const nome=sw.dataset.cor, c=(p.cores||[]).find(x=>x.nome===nome); card.dataset.cor=nome;

  const ph=card.querySelector(".ph"), f=fotoParaCor(p,nome);

function abrirProduto(id,doClique,corIni){

  document.body.appendChild(ov); document.body.style.overflow="hidden";

    window.scrollTo(0,scrollAntes); setTimeout(()=>{ window.scrollTo(0,scrollAntes); window._voltandoModal=false; },350); };

  const atualizaWa=()=>{ const t=$("#persoTxt")?.value.trim(); const url=location.href.split("#")[0]+"#p="+p.id; const pr=precoAtual();

  const tinge=()=>{ if(!selCor) return; const f=fotoParaCor(p,selCor.nome); if(f){ const i=fotos.indexOf(f); if(i>=0) return mostraFoto(i); ov.querySelector(".gal .main").innerHTML=`<img id="mainimg" src="${f}" alt="">`; return; }

  tinge();
  ov.querySelectorAll(".csel").forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); marcaCor(ca[+b.dataset.i]); tinge(); atualizaWa(); });
  ov.querySelectorAll(".capsel").forEach(b=>b.onclick=()=>{ selCap=aa[+b.dataset.i]; ov.querySelectorAll(".capsel").forEach(x=>x.classList.toggle("on",x===b));
    const pr=precoAtual(), o=p.precoAntigo>pr&&pr?Math.round((1-pr/p.precoAntigo)*100):0;
    $("#mprice").innerHTML = pr?`<b>${brl(pr)}</b>${o?`<s>${brl(p.precoAntigo)}</s> <span class="tag off" style="position:static">-${o}%</span>`:""}`:"<b>Sob consulta</b>"; atualizaWa(); });
  atualizaWa(); $("#persoTxt")?.addEventListener("input",atualizaWa);
  $("#share").onclick=async()=>{ const url=location.href.split("#")[0]+"#p="+p.id; try{ if(navigator.share) await navigator.share({title:p.nome,url}); else { await navigator.clipboard.writeText(url); toast("Link copiado!"); } }catch{} };
  const esc_=e=>{ if(e.key==="Escape"){ fechar(); removeEventListener("keydown",esc_);} }; addEventListener("keydown",esc_);
}

    const existe=new Set(S.produtos.map(p=>p.nome.trim().toLowerCase()));
    const novos=catalogoIphones().filter(p=>!existe.has(p.nome.toLowerCase()));
    if(novos.length){ toast(`Cadastrando ${novos.length} modelos de iPhone…`);

      <div class="fld"><label>Condição</label><select class="inp" id="f_cond">${["","Novo","Lacrado","Seminovo","Vitrine"].map(c=>`<option ${p.condicao===c?"selected":""} value="${c}">${c||"— não se aplica —"}</option>`).join("")}</select></div>
    </div>
    <div class="fsec"><div class="fsec-h"><b>Cores</b><span>Marque as que você tem em estoque — só as marcadas aparecem no site</span></div>
      <div class="cores-adm" id="coresAdm"></div>
      <div class="add-row"><input class="inp" id="novaCorNome" placeholder="Nova cor (ex.: Azul-marinho)"><input type="color" id="novaCorHex" value="#888888" class="pick"><button type="button" class="btn btn-g btn-sm" id="addCor">Adicionar cor</button></div>
    </div>
    <div class="fsec"><div class="fsec-h"><b>Armazenamento e preço</b><span>Marque as capacidades disponíveis e o preço de cada uma</span></div>
      <div class="caps-adm" id="capsAdm"></div>
      <div class="add-row"><input class="inp" id="novaCap" placeholder="Nova opção (ex.: 128 GB)"><button type="button" class="btn btn-g btn-sm" id="addCap">Adicionar opção</button></div>
    </div>
    <div class="row">
      <div class="fld"><label id="lblPreco">Preço (R$)</label><input class="inp" id="f_preco" type="text" inputmode="decimal" value="${numStr(p.preco)}" placeholder="0,00 (vazio = Consulte)"></div>
      <div class="fld"><label>Preço antigo / “de” (opcional)</label><input class="inp" id="f_antigo" type="text" inputmode="decimal" value="${numStr(p.precoAntigo)}" placeholder="Mostra o desconto"></div>
    </div>
    <div class="fld"><label>Especificações — uma por linha, no formato “Item: valor”</label><textarea class="inp" id="f_specs" placeholder="Armazenamento: 128 GB&#10;Cor: Preto&#10;Saúde da bateria: 90%&#10;Capacidade: 500 ml">${esc(p.specs)}</textarea></div>
    <div class="fld"><label>Descrição</label><textarea class="inp" id="f_desc" placeholder="Detalhes, o que acompanha, garantia…">${esc(p.descricao)}</textarea></div>
    <div class="row">
      <label class="chk" id="chkAtivo"><input type="checkbox" id="f_ativo" ${p.ativo!==false?"checked":""}> Mostrar no site</label>
      <label class="chk"><input type="checkbox" id="f_dest" ${p.destaque?"checked":""}> Mostrar primeiro no catálogo</label>
      <label class="chk"><input type="checkbox" id="f_pers" ${p.personalizavel?"checked":""}> Aceita personalização (laser)</label>
      <label class="chk"><input type="checkbox" id="f_esg" ${p.esgotado?"checked":""}> Esgotado</label>
    </div>
    <div class="err" id="ferr"></div>
    <div class="sticky-save"><button type="button" class="btn btn-g" id="cancel">Cancelar</button><button class="btn btn-p" id="salvar">Salvar produto</button></div>
  </form></div>`;
  document.body.appendChild(ov); document.body.style.overflow="hidden";
  const fechar=()=>{ ov.remove(); document.body.style.overflow=""; };
  ov.querySelector(".x").onclick=fechar; ov.querySelector(".voltar").onclick=fechar; $("#cancel").onclick=fechar;
  const MAXF=12;
  const drawFotos=()=>{
    const nomes=p.cores.map(c=>c.nome); p.fotosCor=p.fotosCor.map(n=>nomes.includes(n)?n:"");
    $("#fotos").innerHTML = p.fotos.map((f,i)=>{ const cn=p.fotosCor[i], c=p.cores.find(x=>x.nome===cn);
      return `<div class="fwrap"><div class="foto"><img src="${f}" alt="">${i===0?'<span class="capa">CAPA</span>':""}<div class="fx"><button type="button" data-m="${i}" title="Tornar capa">★</button><button type="button" data-r="${i}" title="Remover">✕</button></div></div>
        ${p.cores.length?`<label class="fcor">${c?swatch(c,12):'<i class="sw" style="--c:transparent;width:12px;height:12px;border:1px dashed var(--mut)"></i>'}<select data-fc="${i}"><option value="">Todas as cores</option>${p.cores.map(x=>`<option value="${esc(x.nome)}" ${cn===x.nome?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></label>`:""}</div>`; }).join("")
      + (p.fotos.length<MAXF?`<label class="up"><span style="font-size:26px;line-height:1">📷</span><b>Adicionar fotos</b><input type="file" accept="image/*" multiple class="fi" id="fin"></label>`:"");
    $("#fotos").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.r; p.fotos.splice(i,1); p.fotosCor.splice(i,1); drawFotos(); drawCores(); });
    $("#fotos").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.m; const [f]=p.fotos.splice(i,1); const [n]=p.fotosCor.splice(i,1); p.fotos.unshift(f); p.fotosCor.unshift(n); drawFotos(); });
    $("#fotos").querySelectorAll("[data-fc]").forEach(x=>x.onchange=()=>{ const v=x.value; p.fotosCor[+x.dataset.fc]=v; if(v){ const c=p.cores.find(y=>y.nome===v); if(c&&!c.ativo){ c.ativo=true; autoMostrar(); } } drawCores(); drawFotos(); });
    $("#fin")?.addEventListener("change",async e=>{
      const files=[...e.target.files].slice(0,MAXF-p.fotos.length);
      for(const f of files){ try{ p.fotos.push(await compress(f,1000,"image/jpeg",.78,Math.max(55,150-p.fotos.length*10))); p.fotosCor.push(""); }catch{ toast("Não consegui ler uma das imagens"); } }
      drawFotos();
      if(p.cores.length && files.length) toast("Agora escolha a cor de cada foto embaixo dela");
    });
  };
  drawFotos();
  const autoMostrar=()=>{ if(!$("#f_ativo").checked){ $("#f_ativo").checked=true; const c=$("#chkAtivo"); c.classList.add("flash"); setTimeout(()=>c.classList.remove("flash"),1200); } };
  const drawCores=()=>{
    $("#coresAdm").innerHTML = p.cores.length ? `<div class="cores-tools"><button type="button" class="lnk" data-all="1">Marcar todas</button><button type="button" class="lnk" data-all="0">Desmarcar todas</button></div>`+
      p.cores.map((c,i)=>`<label class="cchip ${c.ativo?"on":""}"><input type="checkbox" data-ci="${i}" ${c.ativo?"checked":""}>${fotoDaCor(p,c.nome)?`<img class="cfoto" src="${fotoDaCor(p,c.nome)}" alt="">`:swatch(c,22)}<span>${esc(c.nome)}</span><button type="button" class="rm" data-cr="${i}" title="Remover cor">×</button></label>`).join("")
      : '<p class="hint">Nenhuma cor cadastrada. Adicione abaixo (opcional).</p>';
    $("#coresAdm").querySelectorAll("[data-ci]").forEach(x=>x.onchange=()=>{ p.cores[+x.dataset.ci].ativo=x.checked; if(x.checked) autoMostrar(); drawCores(); });
    $("#coresAdm").querySelectorAll("[data-cr]").forEach(x=>x.onclick=e=>{ e.preventDefault(); p.cores.splice(+x.dataset.cr,1); drawCores(); drawFotos(); });
    $("#coresAdm").querySelectorAll("[data-all]").forEach(x=>x.onclick=()=>{ p.cores.forEach(c=>c.ativo=x.dataset.all==="1"); if(x.dataset.all==="1") autoMostrar(); drawCores(); });
  };
  const lerPrecosCaps=()=>{ $("#capsAdm").querySelectorAll("[data-pi]").forEach(x=>{ p.armaz[+x.dataset.pi].preco=parseNum(x.value); }); };
  const drawCaps=()=>{
    $("#capsAdm").innerHTML = p.armaz.length ? p.armaz.map((a,i)=>`<div class="caprow ${a.ativo?"on":""}"><label><input type="checkbox" data-ai="${i}" ${a.ativo?"checked":""}><b>${esc(a.cap)}</b></label><input class="inp" data-pi="${i}" type="text" inputmode="decimal" placeholder="Preço (R$)" value="${numStr(a.preco)}"><button type="button" class="rm" data-ar="${i}" title="Remover">×</button></div>`).join("")
      : '<p class="hint">Sem opções de armazenamento. Use o campo “Preço” abaixo.</p>';
    $("#capsAdm").querySelectorAll("[data-ai]").forEach(x=>x.onchange=()=>{ lerPrecosCaps(); p.armaz[+x.dataset.ai].ativo=x.checked; if(x.checked) autoMostrar(); drawCaps(); });
    $("#capsAdm").querySelectorAll("[data-ar]").forEach(x=>x.onclick=()=>{ lerPrecosCaps(); p.armaz.splice(+x.dataset.ar,1); drawCaps(); });
    $("#capsAdm").querySelectorAll("[data-pi]").forEach(x=>x.oninput=()=>{ const a=p.armaz[+x.dataset.pi]; if(parseNum(x.value)>0 && !a.ativo){ a.ativo=true; x.closest(".caprow").classList.add("on"); x.closest(".caprow").querySelector("[data-ai]").checked=true; autoMostrar(); } });
    $("#lblPreco").textContent = p.armaz.length ? "Preço (R$) — usado só se não preencher por armazenamento" : "Preço (R$)";
  };
  drawCores(); drawCaps();
  $("#addCor").onclick=()=>{ const n=$("#novaCorNome").value.trim(); if(!n) return $("#novaCorNome").focus(); p.cores.push({nome:n,hex:$("#novaCorHex").value,ativo:true}); $("#novaCorNome").value=""; autoMostrar(); drawCores(); drawFotos(); };
  $("#addCap").onclick=()=>{ const n=$("#novaCap").value.trim(); if(!n) return $("#novaCap").focus(); lerPrecosCaps(); p.armaz.push({cap:n,preco:0,ativo:true}); $("#novaCap").value=""; autoMostrar(); drawCaps(); };
  $("#pf").onsubmit=async e=>{
    e.preventDefault(); lerPrecosCaps();
    Object.assign(p,{ nome:$("#f_nome").value.trim(), categoria:$("#f_cat").value.trim(), condicao:$("#f_cond").value,
      preco:parseNum($("#f_preco").value), precoAntigo:parseNum($("#f_antigo").value), specs:$("#f_specs").value.trim(), descricao:$("#f_desc").value.trim(),
      ativo:$("#f_ativo").checked, destaque:$("#f_dest").checked, personalizavel:$("#f_pers").checked, esgotado:$("#f_esg").checked, atualizadoEm:Date.now() });
    const pc=capsAtivas(p).map(a=>a.preco).filter(v=>v>0); if(pc.length) p.preco=Math.min(...pc);
    const kb=JSON.stringify(p).length/1024;
    if(kb>950){ $("#ferr").textContent=`As fotos ficaram pesadas demais (${Math.round(kb)} KB). Remova uma ou duas fotos.`; return; }
    $("#salvar").disabled=true; $("#salvar").textContent="Salvando…";
    try{ const saved=await DB.saveProduto(p); const i=S.produtos.findIndex(x=>x.id===saved.id); if(i>=0) S.produtos[i]=saved; else S.produtos.push(saved); toast("Produto salvo!"); fechar(); admProdutos(); }
    catch(err){ $("#ferr").textContent="Erro ao salvar: "+err.message; $("#salvar").disabled=false; $("#salvar").textContent="Salvar produto"; }
  };
}

/* extrai as 2 cores mais marcantes do logo */
function coresDoLogo(src){
  return new Promise(res=>{ const img=new Image(); img.onload=()=>{
    const c=document.createElement("canvas"); const s=64; c.width=s; c.height=s; const x=c.getContext("2d"); x.drawImage(img,0,0,s,s);
    const d=x.getImageData(0,0,s,s).data; const box={};
    for(let i=0;i<d.length;i+=4){ const [r,g,b,a]=[d[i],d[i+1],d[i+2],d[i+3]]; if(a<128) continue;
      const mx=Math.max(r,g,b), mn=Math.min(r,g,b); const sat=mx?(mx-mn)/mx:0; if(sat<.25||mx<40) continue;
      const k=[r>>5,g>>5,b>>5].join(); (box[k]=box[k]||{n:0,r:0,g:0,b:0,s:0}); box[k].n++; box[k].r+=r; box[k].g+=g; box[k].b+=b; box[k].s+=sat; }
    const arr=Object.values(box).map(o=>({n:o.n*(o.s/o.n),c:"#"+[o.r,o.g,o.b].map(v=>Math.round(v/o.n).toString(16).padStart(2,"0")).join("")})).sort((a,b)=>b.n-a.n);
    const dist=(a,b)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)); const A=p(a),B=p(b); return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]);};
    const c1=arr[0]?.c; const c2=arr.find(o=>c1&&dist(o.c,c1)>90)?.c;
    res([c1,c2]); }; img.onerror=()=>res([]); img.src=src; });
}

/* ============================================================
   ROTEAMENTO
   ============================================================ */
let modoAtual="";
function rota(){
  const h=location.hash;
  if(h==="#admin"){ modoAtual="admin"; document.querySelectorAll(".ov").forEach(o=>o.remove()); document.body.style.overflow=""; return renderAdmin(); }
  if(modoAtual!=="site"){ modoAtual="site"; renderSite(); }
  if(!h.startsWith("#p=")){ document.querySelectorAll(".ov").forEach(o=>o.remove()); document.body.style.overflow=""; }
  if(h.startsWith("#p=")){ if(!document.querySelector(".ov")) abrirProduto(h.slice(3)); }
  else if(h.startsWith("#cat=")){ const c=decodeURIComponent(h.slice(5)); if(S.cat!==c) setCat(c,!window._voltandoModal); }
  else if(h && h.length>1 && !window._voltandoModal && document.querySelector(h)) document.querySelector(h).scrollIntoView();
}
addEventListener("popstate",()=>rota());
addEventListener("hashchange",()=>{ if(location.hash==="#"||location.hash===""){ if(modoAtual==="admin"){ modoAtual=""; } } rota(); });

})();
